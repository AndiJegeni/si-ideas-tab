<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SI Ideas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ====== HEADER ====== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="brand-dot"></span>
        <span class="brand-name">SI</span>
        <span class="brand-tab">Ideas</span>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" id="openModalBtn">+ Submit Idea</button>
      </div>
    </div>
  </header>

  <!-- ====== HERO STRIP ====== -->
  <section class="hero">
    <h1 class="hero-title">What should we build next?</h1>
    <p class="hero-sub">Share feature requests, brainstorms, and feedback. Vote for the ideas you love most.</p>
    <div class="hero-stats" id="heroStats">
      <span class="stat"><strong id="statTotal">0</strong> ideas</span>
      <span class="stat-sep">·</span>
      <span class="stat"><strong id="statOpen">0</strong> open</span>
      <span class="stat-sep">·</span>
      <span class="stat"><strong id="statVotes">0</strong> total votes</span>
    </div>
  </section>

  <!-- ====== TOOLBAR ====== -->
  <div class="toolbar">
    <div class="toolbar-inner">

      <!-- Search -->
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 20 20" fill="none">
          <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.8"/>
          <path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input class="search-input" id="searchInput" type="text" placeholder="Search ideas…" />
      </div>

      <!-- Category filters -->
      <div class="filter-group" id="categoryFilters">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="Feature">Feature</button>
        <button class="filter-btn" data-category="Improvement">Improvement</button>
        <button class="filter-btn" data-category="Bug">Bug</button>
        <button class="filter-btn" data-category="Research">Research</button>
        <button class="filter-btn" data-category="Design">Design</button>
        <button class="filter-btn" data-category="Other">Other</button>
      </div>

      <!-- Sort -->
      <div class="sort-wrap">
        <label class="sort-label" for="sortSelect">Sort:</label>
        <select class="sort-select" id="sortSelect">
          <option value="votes">Most Voted</option>
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="title">A – Z</option>
        </select>
      </div>

      <!-- Status filter -->
      <div class="status-wrap">
        <label class="sort-label" for="statusSelect">Status:</label>
        <select class="sort-select" id="statusSelect">
          <option value="all">All</option>
          <option value="open">Open</option>
          <option value="in-progress">In Progress</option>
          <option value="done">Done</option>
          <option value="declined">Declined</option>
        </select>
      </div>

    </div>
  </div>

  <!-- ====== MAIN CONTENT ====== -->
  <main class="main-content">
    <div class="ideas-grid" id="ideasGrid">
      <!-- idea cards injected here -->
    </div>
    <div class="empty-state hidden" id="emptyState">
      <svg viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="30" stroke="#d1d5db" stroke-width="2"/>
        <path d="M22 32c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="#d1d5db" stroke-width="2" stroke-linecap="round"/>
        <circle cx="25" cy="36" r="2" fill="#d1d5db"/>
        <circle cx="39" cy="36" r="2" fill="#d1d5db"/>
      </svg>
      <p>No ideas match your filters.</p>
      <button class="btn btn-secondary" id="clearFiltersBtn">Clear filters</button>
    </div>
  </main>

  <!-- ====== SUBMIT MODAL ====== -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="closeModalBtn" aria-label="Close">&#10005;</button>
      <h2 class="modal-title" id="modalTitle">Submit an Idea</h2>
      <form id="ideaForm" novalidate>

        <label class="form-label" for="ideaTitle">Title <span class="req">*</span></label>
        <input class="form-input" id="ideaTitle" type="text" maxlength="100" placeholder="Give your idea a clear, concise title" required />
        <span class="char-count" id="titleCount">0 / 100</span>

        <label class="form-label" for="ideaDesc">Description <span class="req">*</span></label>
        <textarea class="form-textarea" id="ideaDesc" rows="4" maxlength="500" placeholder="Describe the idea, the problem it solves, and any context that helps…" required></textarea>
        <span class="char-count" id="descCount">0 / 500</span>

        <div class="form-row">
          <div class="form-col">
            <label class="form-label" for="ideaCategory">Category <span class="req">*</span></label>
            <select class="form-input" id="ideaCategory" required>
              <option value="">Select…</option>
              <option>Feature</option>
              <option>Improvement</option>
              <option>Bug</option>
              <option>Research</option>
              <option>Design</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-col">
            <label class="form-label" for="ideaAuthor">Your name</label>
            <input class="form-input" id="ideaAuthor" type="text" maxlength="50" placeholder="Anonymous" />
          </div>
        </div>

        <label class="form-label" for="ideaTags">Tags <span class="hint">(comma-separated)</span></label>
        <input class="form-input" id="ideaTags" type="text" placeholder="e.g. mobile, dashboard, api" />

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Idea</button>
        </div>

      </form>
    </div>
  </div>

  <!-- ====== DETAIL MODAL ====== -->
  <div class="modal-overlay hidden" id="detailOverlay">
    <div class="modal modal-detail" role="dialog" aria-modal="true">
      <button class="modal-close" id="closeDetailBtn" aria-label="Close">&#10005;</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <!-- ====== TOAST ====== -->
  <div class="toast hidden" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
